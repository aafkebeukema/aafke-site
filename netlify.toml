# Netlify builds main and serves aafke.co.uk, including the /api functions.
[build]
  command = "npm run build"
  publish = "dist"

# Each function sets its own route (/api/...) in its config export.
[functions]
  directory = "netlify/functions"

# The cancellation page's URL carries a secret token. Don't send it to other
# sites as a referrer, and keep the page out of search and caches.
[[headers]]
  for = "/talktome/cancel*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
